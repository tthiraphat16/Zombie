<style>

</div>

</div>

<script>
const W=1080,H=1920,DUR=84.2,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='Kanit,Loma,"Noto Sans Thai",sans-serif';

function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.arc(0,0,40,0,TAU);ctx.arc(50,-14,50,0,TAU);ctx.arc(105,0,40,0,TAU);ctx.rect(0,0,105,40);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.restore()}

/* ---------- characters ---------- */
function person(o){
  const type=o.type||'student',s=o.s||1,z=o.z||0,flip=o.flip||1;
  const fat=type==='guard'?1:type==='director'?.8:0, tw=40+fat*40;
  let skin=o.skin||'#f6c99a'; skin=mixc(skin.startsWith('#')?skin:'#f6c99a','#8ccb68',z); if(o.pale)skin=mixc('#f6c99a','#e9eff0',o.pale);
  const ph=o.ph||0,walk=o.walk||0,sw=Math.sin(ph)*walk,girl=o.g==='f';
  let shirt='#ffffff',pants='#22346b',pantLen=55,shoe='#2b2b2b',hair=o.hair||'#2b1d1a';
  if(type==='guard'){shirt='#cdb06f';pants='#a9904f';pantLen=92}
  if(type==='director'){shirt='#f4f6fa';pants='#2f3446';pantLen=92}
  if(type==='vendor'){shirt='#ee7aa3';pants='#6f55a3';pantLen=92;hair='#3a2a2a'}
  if(type==='cadet'){shirt='#516f3d';pants='#42592f';pantLen=92;shoe='#111'}
  if(type==='student'&&girl)pantLen=50;
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(s*flip,s);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,2,tw+34,14,0,0,TAU);ctx.fill();

  if(o.sq)ctx.scale(1-o.sq*.5,1+o.sq);
  ctx.translate(0,-Math.abs(Math.cos(ph))*walk*10);
  const leg=(side,ang)=>{ctx.save();ctx.translate(side*tw*.42,-92);ctx.rotate(ang);rr(-13,0,26,90,13);fs(skin,6);if(!(type==='student'&&girl)){rr(-14.5,0,29,pantLen,13);fs(pants,6)}ctx.beginPath();ctx.ellipse(4,94,23,11,0,0,TAU);fs(shoe,6);ctx.restore()};
  const zs=z>.6?.12:0;

  if(type==='student'&&girl||type==='vendor'){ctx.beginPath();ctx.moveTo(-tw*.9,-105);ctx.lineTo(tw*.9,-105);ctx.lineTo(tw*(type==='vendor'?1.3:1.15),type==='vendor'?-26:-52);ctx.lineTo(-tw*(type==='vendor'?1.3:1.15),type==='vendor'?-26:-52);ctx.closePath();fs(pants,6)}
  /* torso */
  if(fat){ctx.beginPath();ctx.ellipse(0,-135,tw+4,70,0,0,TAU);fs(shirt,6)}else{ctx.beginPath();ctx.roundRect(-tw,-192,tw*2,112,[40,40,34,34]);fs(shirt,6)}
  if(type==='student'){ctx.beginPath();ctx.moveTo(-18,-192);ctx.lineTo(0,-168);ctx.lineTo(18,-192);ctx.closePath();fs('#e9edf7',4);ctx.beginPath();ctx.arc(0,-150,3,0,TAU);fs('#22346b',0);if(!girl){rr(-tw,-98,tw*2,16,6);fs('#1a2859',5)}}
  if(type==='vendor'){rr(-tw*.72,-172,tw*1.44,100,[18,18,12,12]);fs('#ffd86b',5);rr(-18,-130,36,28,6);fs('#f4b942',4);ctx.beginPath();ctx.moveTo(-tw*.5,-172);ctx.lineTo(-18,-192);ctx.moveTo(tw*.5,-172);ctx.lineTo(18,-192);ctx.lineWidth=5;ctx.strokeStyle=SIL?'#1b1026':INK;ctx.stroke()}
  if(type==='guard'){rr(-tw-2,-112,tw*2+4,16,6);fs('#1d1d1d',5);rr(-12,-114,24,20,4);fs('#f2c94c',4);star(-tw*.42,-150,15,'#f2c94c');ctx.beginPath();ctx.moveTo(0,-198);ctx.lineTo(0,-112);ctx.lineWidth=4;ctx.strokeStyle=SIL?'#1b1026':INK;ctx.stroke();ctx.beginPath();ctx.moveTo(-20,-200);ctx.lineTo(-4,-176);ctx.lineTo(0,-198);ctx.moveTo(20,-200);ctx.lineTo(4,-176);ctx.lineTo(0,-198);fs('#bfa15f',4);rr(tw*.35,-160,30,26,5);fs('#bfa15f',4)}
  if(type==='director'){ctx.beginPath();ctx.moveTo(-22,-196);ctx.lineTo(0,-170);ctx.lineTo(22,-196);ctx.closePath();fs('#ffffff',4);ctx.beginPath();ctx.moveTo(-9,-186);ctx.lineTo(9,-186);ctx.lineTo(15,-125);ctx.lineTo(0,-108);ctx.lineTo(-15,-125);ctx.closePath();fs('#d7263d',4)}
  if(type==='cadet'){rr(-tw,-110,tw*2,14,5);fs('#1d1d1d',4);rr(-10,-112,20,18,3);fs('#d4a935',3);rr(tw*.25,-165,30,22,4);fs('#d7263d',3);ctx.fillStyle='#3c5230';[[-22,-150,16],[10,-128,14],[-8,-176,12]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],p[2],p[2]*.6,.4,0,TAU);ctx.fill()})}
  if(z>.6){ctx.beginPath();for(let i=0;i<7;i++){ctx.lineTo(-tw*.7+i*tw*.23,-84+(i%2?-14:0))}ctx.lineWidth=5;ctx.strokeStyle='rgba(42,26,48,.7)';ctx.stroke()}
  /* arms */
  const slv=(type==='cadet'||type==='director')?74:46;
  const arm=(side,a)=>{ctx.save();ctx.translate(side*tw*.88,-170);ctx.rotate(-side*a);rr(-10,30,20,62,10);fs(skin,6);ctx.beginPath();ctx.arc(0,94,13,0,TAU);fs(skin,6);rr(-12.5,-9,25,slv+10,12);fs(shirt,6);ctx.restore()};
  let aL=o.aL,aR=o.aR;const za=1.5+.08*Math.sin(ph*2+1);
  if(aL===undefined)aL=z>.6?za:.14+sw*.5; if(aR===undefined)aR=z>.6?za:.14-sw*.5;
  arm(-1,aL);
  if(o.shh){ctx.save();ctx.translate(tw*.88,-170);ctx.rotate(-.35);rr(-12.5,-9,25,60,12);fs(shirt,6);ctx.translate(0,50);ctx.rotate(3.07);rr(-10,-2,20,60,10);fs(skin,6);ctx.restore()}else arm(1,aR);

  ctx.save();ctx.translate(0,-196);ctx.rotate(o.tilt||0);ctx.translate(0,196);

  if(type==='vendor'){ctx.beginPath();ctx.arc(0,hy-hr-8,26,0,TAU);fs(hair,5)}
  [-1,1].forEach(sd=>{ctx.beginPath();ctx.arc(sd*(hr+(fat?8:0)),hy+4,12,0,TAU);fs(skin,5)});
  ctx.beginPath();ctx.ellipse(0,hy,hr+(fat?8:0),hr,0,0,TAU);fs(skin,6);
  if(type==='student'||type==='vendor'){ctx.beginPath();ctx.ellipse(0,hy-8,hr+3,hr-3,0,Math.PI,TAU);ctx.closePath();fs(hair,5);if(girl||type==='vendor'){[-1,1].forEach(sd=>{rr(sd*(hr-2)-9,hy-12,18,type==='vendor'?30:46,8);fs(hair,4)})}}
  if(type==='cadet'){ctx.beginPath();ctx.ellipse(0,hy-14,hr+3,hr-6,0,Math.PI,TAU);ctx.closePath();fs('#3c5230',5);rr(-hr-8,hy-18,hr*2+16,14,7);fs('#2c3d23',5);star(0,hy-34,9,'#f2c94c')}
  if(type==='guard'||type==='director'){ctx.beginPath();ctx.arc(-18,hy-32,10,.2,3.6);ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.65)';ctx.stroke();if(type==='director'){[-1,1].forEach(sd=>{ctx.beginPath();ctx.ellipse(sd*(hr+2),hy-2,10,16,0,0,TAU);fs('#8d8d96',4)})}}
  if(!SIL){
    let mood=o.mood||(z>.6?'z':'n');const red=o.red!==undefined?o.red:(z>.6?1:0);
    const ex=hr*.4,ey=hy-4;
    const eye=x=>{
      if(o.swirl){ctx.beginPath();ctx.arc(x,ey,15,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();ctx.beginPath();for(let i=0;i<40;i++){const a=i*.45+T_*8,r=i*.34;ctx.lineTo(x+Math.cos(a)*r,ey+Math.sin(a)*r)}ctx.lineWidth=3.5;ctx.stroke();return}
      if(mood==='r'){ctx.beginPath();ctx.arc(x,ey+4,10,Math.PI*1.1,Math.PI*1.9);ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();return}
      const big=(mood==='s'||mood==='sh')?15:11;
      if(red){ctx.save();ctx.shadowColor='#ff2020';ctx.shadowBlur=26;ctx.beginPath();ctx.arc(x,ey,big+2,0,TAU);ctx.fillStyle='#ff2b2b';ctx.fill();ctx.restore();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(x,ey,big+2,0,TAU);ctx.stroke();ctx.fillStyle='#fff2a0';ctx.beginPath();ctx.ellipse(x,ey,3.5,big*.75,0,0,TAU);ctx.fill();return}
      ctx.beginPath();ctx.arc(x,ey,big,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
      const pr=mood==='sh'?3.5:(mood==='s'?4.5:6);ctx.beginPath();ctx.arc(x+(o.lx||0)*4,ey+(o.ly||0),pr,0,TAU);ctx.fillStyle=INK;ctx.fill()};
    if(z>.6&&!o.swirl){ctx.strokeStyle='rgba(90,40,120,.55)';ctx.lineWidth=6;[-1,1].forEach(sd=>{ctx.beginPath();ctx.arc(sd*ex,ey+14,15,.2,Math.PI-.2);ctx.stroke()})}
    eye(-ex);eye(ex);
    ctx.lineWidth=6;ctx.strokeStyle=SIL?'#1b1026':INK;ctx.lineCap='round';
    const br=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
    if(mood==='z'&&!o.swirl){br(-ex-14,ey-24,-ex+12,ey-12);br(ex+14,ey-24,ex-12,ey-12)}
    else if(mood==='s'||mood==='sh'){br(-ex-12,ey-18,-ex+12,ey-30);br(ex+12,ey-18,ex-12,ey-30)}
    else if(mood==='h'){br(-ex-12,ey-22,-ex+10,ey-24);br(ex-10,ey-30,ex+12,ey-22)}
    else if(mood!=='r'&&!o.swirl){br(-ex-10,ey-24,-ex+10,ey-24);br(ex-10,ey-24,ex+10,ey-24)}
    const my=hy+hr*.52;
    if(o.swirl){ctx.beginPath();ctx.moveTo(-18,my);for(let i=1;i<=6;i++)ctx.lineTo(-18+i*6,my+(i%2?6:-4));ctx.stroke()}
    else if(mood==='z'){ctx.beginPath();ctx.moveTo(-26,my-6);ctx.quadraticCurveTo(0,my+40,26,my-6);ctx.closePath();fs('#4a1020',4);ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-20+i*13,my-6);ctx.lineTo(-13.5+i*13,my+6);ctx.lineTo(-7+i*13,my-6);ctx.fill()}}
    else if(mood==='h'){ctx.beginPath();ctx.arc(0,my-10,19,.1,Math.PI-.1);ctx.closePath();fs('#8a2432',4);ctx.fillStyle='#fff';ctx.fillRect(-12,my+2,24,6)}
    else if(mood==='s'){ctx.beginPath();ctx.ellipse(0,my+4,10,14,0,0,TAU);fs('#5a1a28',4)}
    else if(mood==='sh'){ctx.beginPath();ctx.ellipse(0,my+6,15,22,0,0,TAU);fs('#5a1a28',4);ctx.beginPath();ctx.ellipse(0,my+16,9,7,0,0,TAU);ctx.fillStyle='#f07a8a';ctx.fill()}
    else if(mood==='r'){ctx.beginPath();ctx.arc(0,my-10,17,.2,Math.PI-.2);ctx.stroke()}

    if(type==='director'){const gy=(o.glass||0)*16;ctx.lineWidth=5;ctx.strokeStyle=INK;[-1,1].forEach(sd=>{ctx.beginPath();ctx.arc(sd*ex,ey+gy,22,0,TAU);ctx.stroke()});ctx.beginPath();ctx.moveTo(-ex+22,ey+gy);ctx.lineTo(ex-22,ey+gy);ctx.stroke()}
    if(o.sweat){for(let i=0;i<3;i++){const p=((T_*1.3+i/3)%1);const sx=(i-1)*(hr+14)*.9+(i==1?0:(i-1)*6),sy=hy-hr+10+p*70;ctx.globalAlpha=1-p*.8;ctx.beginPath();ctx.moveTo(sx,sy-14);ctx.quadraticCurveTo(sx+12,sy+4,sx,sy+10);ctx.quadraticCurveTo(sx-12,sy+4,sx,sy-14);ctx.fillStyle='#6fc8ff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.globalAlpha=1}}
    if(o.shh){rr(-8,my-30,16,52,8);fs(skin,5);ctx.beginPath();ctx.arc(6,my+26,13,0,TAU);fs(skin,5)}
  }

  if(o.phone){ctx.save();ctx.translate(hr+22,hy+6);ctx.rotate(-.18);rr(-12,-56,24,112,12);fs('#d7263d',5);rr(-18,-62,36,24,8);fs('#8a1b2a',4);rr(-18,38,36,24,8);fs('#8a1b2a',4);ctx.restore()}
  ctx.restore();
}
const TONES=['#f6c99a','#e9b27f','#d9a066','#f3c1a0','#e2ae86','#c88f5e'],HAIR=['#2b1d1a','#3b2a22','#171216','#4a3324'];
const kid=(i,o)=>Object.assign({type:'student',g:i%2?'f':'m',skin:TONES[i%6],hair:HAIR[i%4]},o);

/* ---------- backgrounds ---------- */
function bgExt(t,o={}){
  let g=ctx.createLinearGradient(0,0,0,1000);g.addColorStop(0,'#5fc4ff');g.addColorStop(1,'#e6f7ff');ctx.fillStyle=g;ctx.fillRect(-300,-300,1680,1300);
